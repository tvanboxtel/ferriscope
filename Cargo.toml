[package]
name = "ferriscope"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[features]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]

[dependencies]
dioxus = "=0.7.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = "0.6"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "6"
tempfile = "3"
async-process = "2"
